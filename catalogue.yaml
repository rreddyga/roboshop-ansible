- name: configure catalogue
  hosts: catalogue
  become: yes
  vars:
    MONGODB_HOST: mongodb-dev.sanathananelaform.online # Ensure this is defined in inventory/group_vars
  tasks:
  - name: enable nodejs 20
    ansible.builtin.command: dnf module enable nodejs:20 -y

  - name: install nodejs
    ansible.builtin.dnf:
      name: nodejs
      state: present

  - name: create system user roboshop
    ansible.builtin.user:
      name: roboshop
      system: true
      home: /app
      shell: /sbin/nologin
      comment: "Roboshop system user"

  - name: delete app directory
    ansible.builtin.file:
      path: /app
      state: absent

  - name: create app directory
    ansible.builtin.file:
      path: /app
      state: directory

  - name: delete catalogue zip file
    ansible.builtin.file:
      path: /tmp/catalogue.zip
      state: absent

  - name: download catalogue
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/catalogue-v3.zip
      dest: /tmp/catalogue.zip

  - name: unarchive catalogue
    ansible.builtin.unarchive:
      src: /tmp/catalogue.zip
      dest: /app
      remote_src: yes

  - name: install dependencies
    community.general.npm:
      path: /app

  - name: copy catalogue service
    ansible.builtin.copy:
      src: catalogue.service
      dest: /etc/systemd/system/catalogue.service

  - name: copy mongo repo
    ansible.builtin.copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo

  - name: install mongodb client
    ansible.builtin.dnf:
      name: mongodb-mongosh
      state: present

  # NEW: Wait for MongoDB connectivity (critical fix)
  - name: Wait for MongoDB port 27017 to be available
    ansible.builtin.wait_for:
      host: "{{ MONGODB_HOST }}"
      port: 27017
      state: started
      timeout: 120
      delay: 5
    register: mongo_wait

  - name: Display MongoDB wait result
    ansible.builtin.debug:
      msg: "MongoDB at {{ MONGODB_HOST }}:27017 is {{ 'reachable' if mongo_wait.elapsed < 120 else 'timed out' }}"

  - name: Test MongoDB ping connectivity
    ansible.builtin.command: mongosh --host "{{ MONGODB_HOST }}" --quiet --eval "db.runCommand('ping')"
    register: mongodb_ping
    failed_when: mongodb_ping.rc != 0
    retries: 3
    delay: 10

  - name: check products loaded
    ansible.builtin.command: mongosh --host "{{ MONGODB_HOST }}" --quiet --eval "db.getMongo().getDBNames().indexOf('catalogue')"
    register: catalogue_output
    failed_when: false # Don't fail playbook if DB check fails

  - name: print the output
    ansible.builtin.debug:
      msg: "Catalogue DB exists: {{ 'Yes ({{ catalogue_output.stdout }})' if catalogue_output.rc == 0 else 'No/Connection failed' }}"

  - name: load the products data
    ansible.builtin.shell: mongosh --host "{{ MONGODB_HOST }}" /app/db/master-data.js
    when:
    - catalogue_output.rc == 0
    - (catalogue_output.stdout | int) < 0
    register: load_data_result

  - name: Display data load result
    ansible.builtin.debug:
      msg: "Data loaded: {{ load_data_result is succeeded | default('skipped') }}"

  - name: start catalogue service
    ansible.builtin.service:
      name: catalogue
      state: restarted
      enabled: yes
    # Only restart if MongoDB data is ready or already exists
    when:
    - catalogue_output.rc == 0 or
    - load_data_result is succeeded
